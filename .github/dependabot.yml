version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # bun, not npm: CI installs with bun and enforces bun.lock (frozen under CI). The npm ecosystem
  # updated package-lock.json but left bun.lock stale, so every dependabot PR failed `bun
  # install`; the bun ecosystem (GA 2025-02) updates bun.lock in lockstep.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      types:
        patterns:
          - "@types/*"

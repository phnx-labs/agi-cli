name: Bench

# Post-merge benchmark harnesses, Linux-only and informational: most steps continue-on-error,
# so a regression never blocks a merge (infra failures still go red); the session-query threshold
# stays a PR check in tests.yml. Each harness runs on a fresh HOME; resolve-perf no-ops in CI.

on:
  push:
    branches: ['main', 'release/**']
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions: {}
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Bench — agent-spec resolution
        continue-on-error: true
        run: HOME="$(mktemp -d)" bun bench/resolve-perf.ts

      - name: Bench — sessions indexing pipeline
        continue-on-error: true
        run: HOME="$(mktemp -d)" bun bench/sessions-perf.ts

      - name: Bench — concurrent session writes
        continue-on-error: true
        run: HOME="$(mktemp -d)" bun tests/bench-concurrent-writes.ts

      - name: Bench — distributed session-query regression guard (RUSH-2118)
        # NOT continue-on-error, deliberately — see the file header comment.
        run: bun bench/sessions-active-perf.ts

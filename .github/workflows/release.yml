name: Release

on:
  push:
    branches:
      - 'release/**'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: build, attest, publish
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Version from branch name
        id: version
        run: |
          set -euo pipefail
          branch="${GITHUB_REF#refs/heads/release/}"
          if [[ ! "$branch" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$ ]]; then
            echo "::error::release branch must be release/x.y.z or release/x.y.z-pre.n, got release/$branch"
            exit 1
          fi
          echo "version=$branch" >> "$GITHUB_OUTPUT"
          echo "Releasing agents-cli $branch"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Use trusted-publishing npm
        run: |
          set -euo pipefail
          current="$(npm --version)"
          if [[ "$(printf '%s\n%s\n' 11.5.1 "$current" | sort -V | head -1)" != 11.5.1 ]]; then
            npm install --global npm@12.2.0
          fi
          npm --version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Toolchain fingerprint for the cache key
        id: toolchain
        run: echo "fp=$(node -v)-$(bun -v)" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            cli/node_modules
            packages/session-tracker/node_modules
          key: bun-deps-${{ runner.os }}-${{ steps.toolchain.outputs.fp }}-${{ hashFiles('cli/bun.lock', 'packages/session-tracker/bun.lock') }}

      - name: Build, attest, install-smoke, and publish
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-ci.sh "${{ steps.version.outputs.version }}"

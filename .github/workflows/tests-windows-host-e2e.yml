name: Windows-host e2e (tailnet)

# Runs the live Windows-host integration suites (issue #864): browser/drivers/ssh.e2e.test.ts
# drives the real remote runtime against win-mini over the tailnet. Env-gated on
# AGENTS_TEST_WIN_HOST. Its runner is self-hosted and the repo public: never add pull_request.

on:
  push:
    branches: ['main']
    paths:
      - 'cli/src/lib/ssh-tunnel.ts'
      - 'cli/src/lib/ssh-exec.ts'
      - 'cli/src/lib/browser/drivers/ssh.ts'
      - 'cli/src/lib/browser/drivers/ssh.e2e.test.ts'
      - '.github/workflows/tests-windows-host-e2e.yml'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# One run at a time: the suite mutates real remote state on win-mini (a launched
# browser, tunnel ports). Queue instead of cancel — a killed run could leave the
# remote half-torn-down.
concurrency:
  group: windows-host-e2e
  cancel-in-progress: false

jobs:
  win-host-e2e:
    # Belt-and-braces with the trigger list above: never run from a fork context.
    if: github.repository == 'phnx-labs/agi-cli'
    runs-on: [self-hosted, crabbox-ci, tailnet]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    env:
      AGENTS_TEST_WIN_HOST: win-mini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('cli/bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Windows-host e2e suite
        run: bun run test -- src/lib/browser/drivers/ssh.e2e.test.ts

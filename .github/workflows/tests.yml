name: Tests

# Required per-PR correctness gate (RUSH-2666). One Linux job named `test`
# preserves the required-check context used by branch protection and
# release.sh. It classifies the merge-base → head range, runs only the
# selected tests/checks, and reuses an exact-tree proof on retry. Unmapped
# paths fail immediately. Windows is best-effort post-merge only.

on:
  pull_request:
    branches: ['main', 'release/**']
  push:
    branches: ['main']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The required check spends far more time INSTALLING than testing. Measured
      # across recent Linux required runs: `bun install` is 14-22s for 273
      # packages on every run, whether the impact plan selected 78 test files or
      # 2, while the release check's actual test execution is 0.27s. That install
      # is a fixed cost every PR pays, so caching it is the single largest lever
      # on the required-check budget (AGENTS.md R1) -- and unlike a faster runner
      # it costs nothing to operate.
      #
      # Keyed on BOTH lockfiles, because this caches BOTH node_modules trees that
      # installCommandsForPlan() targets. Keying on cli/bun.lock alone would serve a
      # stale packages/session-tracker/node_modules under a key claiming it was
      # fresh whenever that package's deps moved on their own -- the exact cache
      # poisoning this step is otherwise careful to avoid. A dependency change in
      # either misses and reinstalls, which is exactly today's behavior, so a miss
      # can never be slower than not caching.
      # restore-keys is deliberately omitted -- a partial restore against a
      # different lockfile would install ON TOP of stale modules, and
      # `--frozen-lockfile` is what guarantees the tree matches the lock. Correct
      # beats warm here: the attestation binds tested tree to published tarball.
      # Toolchain goes in the key too. `cli/package.json` declares
      # `trustedDependencies: ["@homebridge/node-pty-prebuilt-multiarch"]`, a NATIVE
      # addon whose prebuilt binary is Node-ABI-specific, and nothing here pins a
      # Node version -- the runner image supplies it and GitHub rolls it. A cached
      # `node_modules` carrying a binary built for the previous ABI would surface as
      # a confusing native-load failure rather than a clean miss, so a toolchain
      # change must invalidate the cache.
      - name: Toolchain fingerprint for the cache key
        id: toolchain
        run: echo "fp=$(node -v)-$(bun -v)" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            cli/node_modules
            packages/session-tracker/node_modules
          key: bun-deps-${{ runner.os }}-${{ steps.toolchain.outputs.fp }}-${{ hashFiles('cli/bun.lock', 'packages/session-tracker/bun.lock') }}
      - name: Guard public artifacts against confidential strategy leaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/guard-artifacts-confidential.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Enforce the exact comment-line ratchet
        run: bun scripts/comment-lines.ts --check --base "$(git rev-parse HEAD^1)"
      - name: Pin release-matrix trigger policy, .agents/ layout, and the impact gate
        run: bun test ./.github/workflows/ ./scripts/ci-bench/
      - name: Impact plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bun scripts/ci-scope.ts --base "$BASE_SHA" --head "$HEAD_SHA" \
            --json --fail-unmapped --plan-file "$RUNNER_TEMP/impact-plan.json" \
            --github-output "$GITHUB_OUTPUT"
          bun scripts/ci-scope.ts --validate-manifest
      - name: Restore exact-tree proof
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: impact-proof.json
          key: impact-proof-${{ runner.os }}-${{ steps.plan.outputs.tree }}-${{ steps.plan.outputs.policy_digest }}
      - name: Reuse exact-tree proof
        id: reuse
        run: |
          set -euo pipefail
          bun scripts/ci-scope.ts --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --plan-file "$RUNNER_TEMP/impact-plan.json" \
            --reuse-proof impact-proof.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Selected proof
        if: steps.reuse.outputs.reused != 'true'
        env:
          IMPACT_STARTED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          set -euo pipefail
          export IMPACT_STARTED_AT="$(date +%s)"
          bun scripts/ci-scope.ts --run "$RUNNER_TEMP/impact-plan.json"
          bun scripts/ci-scope.ts --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --plan-file "$RUNNER_TEMP/impact-plan.json" \
            --write-proof impact-proof.json
      - name: Publish the mapping table
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Impact plan"
            echo
            echo '```'
            bun scripts/ci-scope.ts --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}"
            echo '```'
            if [ -f impact-proof.json ]; then
              echo
              echo "reused=${{ steps.reuse.outputs.reused }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Populate the dependency cache on the DEFAULT BRANCH so pull requests can
  # actually restore it.
  #
  # Without this the cache is dead weight. GitHub scopes caches per ref: a run
  # restores only from its OWN branch or the default branch, and the required
  # `test` job runs on `pull_request` ONLY -- so every entry it saved landed under
  # `refs/pull/<N>/merge`, invisible to every other PR. Measured after shipping
  # the cache: `deps-cache-hit=0` and `packages installed [21.63s]` on unrelated
  # PRs, i.e. a permanent cold miss for everyone except a re-run of the same PR.
  #
  # This job writes the identical key on push to main, so the first PR after any
  # lockfile or toolchain change pays the install once and every later PR hits.
  # It is push-only, so it never joins the required PR check identity.
  warm-dep-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Toolchain fingerprint for the cache key
        id: toolchain
        run: echo "fp=$(node -v)-$(bun -v)" >> "$GITHUB_OUTPUT"
      # Same key and paths as the required job. If these ever drift apart the warm
      # cache stops being restorable there, which is the failure this job exists to
      # prevent -- tests-gate.test.ts pins them equal.
      - name: Restore dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            cli/node_modules
            packages/session-tracker/node_modules
          key: bun-deps-${{ runner.os }}-${{ steps.toolchain.outputs.fp }}-${{ hashFiles('cli/bun.lock', 'packages/session-tracker/bun.lock') }}
      - name: Install to populate the cache
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --cwd cli
          bun install --frozen-lockfile --cwd packages/session-tracker

  windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 8
    continue-on-error: true
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Best-effort post-merge smoke. Not required for merge or release.
      - run: bun run test -- src/lib/platform src/lib/hooks src/lib/binary-shadow.test.ts src/lib/installations/shims.test.ts src/lib/installations/shims.device-pins.test.ts

name: Tests

# Required per-PR correctness check (RUSH-2666): one Linux job named `test` keeps the
# required-check context used by branch protection and release.sh.

on:
  pull_request:
    branches: ['main', 'release/**']
  push:
    branches: ['main']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The required check spends far more time installing (bun install 14-22s) than testing
      # (0.27s), so caching is the biggest R1 lever. Key on BOTH lockfiles and the toolchain
      # (node-pty is ABI-specific). No restore-keys: partial restores install over stale modules.
      - name: Toolchain fingerprint for the cache key
        id: toolchain
        run: echo "fp=$(node -v)-$(bun -v)" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            cli/node_modules
            packages/session-tracker/node_modules
          key: bun-deps-${{ runner.os }}-${{ steps.toolchain.outputs.fp }}-${{ hashFiles('cli/bun.lock', 'packages/session-tracker/bun.lock') }}
      - name: Guard public artifacts against confidential strategy leaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/guard-artifacts-confidential.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Pin release-matrix trigger policy, .agents/ layout, and the impact gate
        run: bun test ./.github/workflows/ ./scripts/ci-bench/
      - name: Impact plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bun scripts/ci-scope.ts --base "$BASE_SHA" --head "$HEAD_SHA" \
            --json --fail-unmapped --plan-file "$RUNNER_TEMP/impact-plan.json" \
            --github-output "$GITHUB_OUTPUT"
          bun scripts/ci-scope.ts --validate-manifest
      - name: Restore exact-tree proof
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: impact-proof.json
          key: impact-proof-${{ runner.os }}-${{ steps.plan.outputs.tree }}-${{ steps.plan.outputs.policy_digest }}
      - name: Reuse exact-tree proof
        id: reuse
        run: |
          set -euo pipefail
          bun scripts/ci-scope.ts --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --plan-file "$RUNNER_TEMP/impact-plan.json" \
            --reuse-proof impact-proof.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Selected proof
        if: steps.reuse.outputs.reused != 'true'
        env:
          IMPACT_STARTED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          set -euo pipefail
          export IMPACT_STARTED_AT="$(date +%s)"
          bun scripts/ci-scope.ts --run "$RUNNER_TEMP/impact-plan.json"
          bun scripts/ci-scope.ts --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --plan-file "$RUNNER_TEMP/impact-plan.json" \
            --write-proof impact-proof.json
      - name: Publish the mapping table
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Impact plan"
            echo
            echo '```'
            bun scripts/ci-scope.ts --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}"
            echo '```'
            if [ -f impact-proof.json ]; then
              echo
              echo "reused=${{ steps.reuse.outputs.reused }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Populate the dependency cache on the default branch. GitHub restores only from a run's own
  # branch or the default branch, and the required `test` job runs on `pull_request` only, so its
  # entries land under refs/pull/<N>/merge. This push-only job writes the same key on main.
  warm-dep-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Toolchain fingerprint for the cache key
        id: toolchain
        run: echo "fp=$(node -v)-$(bun -v)" >> "$GITHUB_OUTPUT"
      # Same key and paths as the required job. If these ever drift apart the warm
      # cache stops being restorable there, which is the failure this job exists to
      # prevent -- tests-gate.test.ts pins them equal.
      - name: Restore dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            cli/node_modules
            packages/session-tracker/node_modules
          key: bun-deps-${{ runner.os }}-${{ steps.toolchain.outputs.fp }}-${{ hashFiles('cli/bun.lock', 'packages/session-tracker/bun.lock') }}
      - name: Install to populate the cache
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --cwd cli
          bun install --frozen-lockfile --cwd packages/session-tracker

  windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 8
    continue-on-error: true
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Best-effort post-merge smoke. Not required for merge or release.
      - run: bun run test -- src/lib/platform src/lib/hooks src/lib/binary-shadow.test.ts src/lib/installations/shims.test.ts src/lib/installations/shims.device-pins.test.ts

name: CI

# The cross-platform matrix is expensive (macOS billed 10x, Windows 2x) and redundant per PR,
# since every PR to main already runs the real suite on Linux via `test` plus `gitleaks`. Per
# AGENTS.md, rare-platform suites run after merge or nightly; workflow_dispatch can still run it.
on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC nightly cross-platform sweep
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions: {}
    defaults:
      run:
        working-directory: cli
    strategy:
      # Run every OS x node combo to completion so a single platform failure
      # doesn't mask the others — we want the full cross-platform picture.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    # Runs nightly + on manual dispatch, off the release path. None of these
    # legs are required on main PRs — the main-protection ruleset gates merges
    # on the cheap `test` + `gitleaks` checks instead.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --ignore-scripts

      # picker.test.ts and sync.test.ts spawn a real pty via node-pty
      # (@homebridge/node-pty-prebuilt-multiarch, a devDependency since the engine moved to the
      # standalone term-cli, PHNX-4091). The script prefers a prebuilt and falls back to node-gyp.
      - name: Build node-pty native binary
        shell: bash
        run: cd node_modules/@homebridge/node-pty-prebuilt-multiarch && npm run install

      # --with-deps installs OS-level libs for headless Chromium and only works
      # on Linux (apt). macOS and Windows ship the needed libs already.
      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright browsers (macOS/Windows)
        if: runner.os != 'Linux'
        run: bunx playwright install chromium

      - name: Build
        run: bun run build

      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "Windows release leg stops after install + native deps + build; full Vitest remains on Linux and path-filtered Windows gates."
          else
            bun run test
          fi

  # No CI publish job: it runs through `scripts/release.sh <version> --apply`, which gates the
  # merge on `test` + `gitleaks` and the publish on an exact-tree attestation. Native helpers no
  # longer ship in the tarball (RUSH-3100), so a release is promote-only on any OS (RUSH-3026).

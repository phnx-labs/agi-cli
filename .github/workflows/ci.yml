name: CI

# The cross-platform build matrix is EXPENSIVE (macOS is billed 10x, Windows 2x
# on GitHub-hosted runners) and largely redundant per-PR: every PR to main
# already runs the real suite cheaply on Linux via `test` (tests.yml) plus
# `gitleaks` (secret-scan.yml).
#
# It runs on a NIGHTLY schedule plus manual dispatch — deliberately OFF the
# release path. It used to fire on release/** branch pushes/PRs, but that was
# 16-53 min of macOS/Windows-billed work on every release while gating NOTHING:
# the matrix is not a required check (main requires only `test` + `gitleaks`),
# and scripts/release.sh never waited on it (it gates the merge on the required
# checks and the publish on an exact-tree attestation). Worse, a macOS-only
# failure had it red on every recent release, so it added cost and a false
# "release is failing" signal without ever protecting a release. Per repo
# doctrine (root AGENTS.md — "rare-platform suites run after merge or nightly;
# they do not block the required PR result"), cross-platform coverage lives
# here on the nightly lane. A risky release can still run it on demand via
# workflow_dispatch before shipping.
on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC nightly cross-platform sweep
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions: {}
    defaults:
      run:
        working-directory: cli
    strategy:
      # Run every OS x node combo to completion so a single platform failure
      # doesn't mask the others — we want the full cross-platform picture.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    # Runs nightly + on manual dispatch, off the release path. None of these
    # legs are required on main PRs — the main-protection ruleset gates merges
    # on the cheap `test` + `gitleaks` checks instead.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --ignore-scripts

      # picker.test.ts and sync.test.ts spawn a REAL pty via node-pty
      # (@homebridge/node-pty-prebuilt-multiarch, a devDependency now that the
      # engine itself lives in the standalone term-cli, PHNX-4091). That
      # package ships prebuilt binaries only for Linux; macOS/Windows fetch
      # (or compile) pty.node via its own install script. bun does not run
      # that script here (not even without --ignore-scripts, as of bun
      # 1.3.x), so build this one native dep explicitly — otherwise those
      # tests crash on macOS/Windows (Linux uses the shipped prebuild and
      # stayed green, masking the break; this matrix runs only nightly, so a
      # break shows the next morning, not on the PR). The package's install
      # script prefers a prebuilt download and falls back to a node-gyp
      # compile, so it self-heals on runners with no matching prebuilt.
      - name: Build node-pty native binary
        shell: bash
        run: cd node_modules/@homebridge/node-pty-prebuilt-multiarch && npm run install

      # --with-deps installs OS-level libs for headless Chromium and only works
      # on Linux (apt). macOS and Windows ship the needed libs already.
      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright browsers (macOS/Windows)
        if: runner.os != 'Linux'
        run: bunx playwright install chromium

      - name: Build
        run: bun run build

      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "Windows release leg stops after install + native deps + build; full Vitest remains on Linux and path-filtered Windows gates."
          else
            bun run test
          fi

  # No CI publish job — publishing runs through `scripts/release.sh <version>
  # --apply`, which gates the merge on the required `test` + `gitleaks` checks and
  # the publish on an exact-tree attestation (release-attestation.sh). This
  # cross-platform matrix is NOT part of that gate: it runs nightly for coverage,
  # never on the release PR, so it neither blocks nor speeds a release. Native
  # helpers no longer ship in the tarball (RUSH-3100) — they resolve from their
  # own signed release tags — so an ordinary release is promote-only and runs on
  # any OS (RUSH-3026).

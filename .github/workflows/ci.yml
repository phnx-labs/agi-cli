name: CI

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions: {}
    defaults:
      run:
        working-directory: cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build node-pty native binary
        shell: bash
        run: cd node_modules/@homebridge/node-pty-prebuilt-multiarch && npm run install

      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright browsers (macOS/Windows)
        if: runner.os != 'Linux'
        run: bunx playwright install chromium

      - name: Build
        run: bun run build

      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "Windows release leg stops after install + native deps + build; full Vitest remains on Linux and path-filtered Windows gates."
          else
            bun run test
          fi

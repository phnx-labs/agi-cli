# Reviewed non-static test ownership for the required Linux impact check; the policy version is
# part of the exact-tree proof identity (RUSH-2666). No silent skip, no implicit full-suite
# fallback.

policy_version: impact-v1

areas:
  - prefix: cli/src/
    companion: true
    related: true
    checks: [typecheck]
  - prefix: cli/scripts/
    companion: true
  - prefix: cli/
    companion: true
    related: true
  - prefix: packages/session-tracker/
    checks: [session-tracker]
  - prefix: scripts/
    companion: true
  - prefix: .github/
    checks: [workflow-policy]

groups:
  # Shared configuration changes cross account, installation, daemon and command boundaries.
  # PHNX-3940 (PR #3473: 254 files, ~333s measured) earns a 420s allowance, requiring >= 250
  # selected CLI test files; leaf budgets stay as declared. Lower once the selection is split.
  - id: shared-config-state
    when:
      - cli/src/lib/state.ts
    checks: [typecheck]
    budget_sec: 420
    budget_min_selected_cli_tests: 250

  # The core agent registry (AGENT_IDS in lib/types.ts, AGENTS in agent-spec/agents.ts) fans out
  # via `related` (areas: cli/src/) to nearly every CLI importer. Removing the retired Gemini
  # agent (run 34930857687) took 337s; grant 420s. No budget_min: such an edit is never narrow.
  - id: agent-registry
    when:
      - cli/src/lib/types.ts
      - cli/src/lib/agent-spec/agents.ts
    checks: [typecheck]
    budget_sec: 420

  # 120s, not the default 85s: the grouped --help text lives in bootstrap.ts, so any one-line
  # surface edit selects non-interactive.test.ts (54s) plus command-surface tests. PR #2826 run
  # 32431700986 measured 93s (212 tests passing) and failed the 85s limit.
  - id: cli-bootstrap
    when:
      - cli/src/bootstrap.ts
      - cli/src/index.ts
      # There is no cli/src/browser.ts, cli/src/computer.ts or build-win.sh entry: the `browser`
      # entry left with the standalone `browser` engine (PHNX-4101), and the `computer` bin and
      # Windows helper build with the standalone `computer` engine (PHNX-4075).
      - cli/scripts/build.sh
      - cli/scripts/build-bin.sh
    tests:
      - cli/tests/non-interactive.test.ts
      - cli/src/index.command-star-routing.test.ts
      - cli/src/index.spellcheck.test.ts
      - cli/src/index.tombstones.test.ts
    checks: [typecheck, binary-smoke]
    budget_sec: 120

  - id: command-surface
    when:
      - cli/src/commands/**
      - cli/src/cli/**
      - cli/scripts/gen-command-index.ts
      - cli/scripts/gen-command-index.test.ts
      - cli/scripts/verify-command-index.sh
      - cli/scripts/verify-docs.sh
      - cli/docs/command-index.md
      - cli/docs/command-index.json
    checks: [command-index, docs, typecheck]
    # The devices/config tests drive the real CLI as a subprocess, so each case costs a process
    # spawn; the group sat near the 85s default before RUSH-3062 added the devices-list surface,
    # and run 32643687531 measured 102s. Lower when devices tests leave the required lane.
    budget_sec: 120

  - id: cli-docs
    when:
      - cli/docs/**
      - cli/AGENTS.md
      - cli/CHANGELOG.md
    checks: [docs]

  # CHANGELOG.md is generated from .changelog/<version>.md (gen-changelog.ts), and
  # gen-changelog.test.ts asserts the committed file matches its sources. Selecting the test from
  # the files it guards moves the failure to the causing PR.
  - id: changelog-sources
    when:
      - cli/CHANGELOG.md
      - cli/.changelog/**
    tests:
      - cli/scripts/gen-changelog.test.ts

  # The repo-root Claude plugin marketplace manifest and the agents-cli discovery skill
  # (PHNX-3337) are declarative, but their parse/validate/trigger-intent contract is executable
  # (agents-cli-plugin.test.ts reads marketplace.json, plugin.json and SKILL.md).
  - id: agents-cli-plugin
    when:
      - .claude-plugin/**
      - skills/agents-cli/**
    tests:
      - cli/src/lib/plugins/agents-cli-plugin.test.ts

  # Sessions budget: 180s then 240s, not the default 85s. Any sessions.ts edit selects the whole
  # sessions* suite (24 files, 92s of vitest, PR #2771) so no new `agents sessions <verb>` could
  # merge at 85s; the session/* re-export shims (PR #2796) measured 198s and failed 180s.
  - id: sessions
    when:
      - cli/src/lib/session/**
      - cli/src/commands/sessions.ts
      - cli/src/commands/sessions.test.ts
      - cli/src/commands/sessions.*.test.ts
      - cli/src/commands/sessions.test-fixture.ts
      - cli/src/commands/__tests__/sessions-*.test.ts
      - cli/bench/sessions-active-perf.ts
    tests:
      - cli/src/commands/sessions.cli-list.test.ts
      - cli/src/commands/sessions.cli-tools.test.ts
      - cli/src/commands/sessions.computer.test.ts
      - cli/src/commands/sessions.render.test.ts
    checks: [typecheck, sessions-bench]
    budget_sec: 240

  # Daemon budget: 240s, not 85s. Moving runner.ts into daemon/ (PR #2803, run 32395701692)
  # selected routines.test.ts (78 tests / 174s of vitest) inside a 213s impact run; at 85s no
  # runner.ts change retargeting commands/routines.ts can merge. Lower when split.
  - id: daemon
    when:
      - cli/src/lib/daemon/**
      - cli/src/lib/daemon-ticks.ts
      - cli/src/commands/daemon.ts
      - cli/src/commands/daemon.test.ts
    checks: [typecheck]
    budget_sec: 240

  # Scheduling budget: 180s, not 85s. scheduling/routines.ts is the JobConfig hub, so a change
  # selects routines/runner/daemon/monitors companions and importers (PR #2837, run 32434389380:
  # 28 files / 715 tests passing in 153s). Lower when split.
  - id: scheduling
    when:
      - cli/src/lib/scheduling/**
      - cli/src/commands/routines.ts
      - cli/src/commands/routines.test.ts
      - cli/src/commands/routines.*.test.ts
      - cli/src/commands/routines.test-fixture.ts
    tests:
      - cli/src/commands/routines.add.test.ts
      - cli/src/commands/routines.list.test.ts
    checks: [typecheck]
    budget_sec: 180

  # Installations budget: 120s, not 85s. versions.ts is the install/sync hub, so any edit selects
  # companion and importer tests including daemon/runner and heal-dangling. PR #2840 run
  # 32436359101 measured 97s of a passing run. Raise only against a measured run.
  - id: installations
    when:
      - cli/src/lib/installations/**
    checks: [typecheck]
    budget_sec: 120

  # Secrets budget: 240s, not 85s. The embedded engine is gone (PHNX-3989 Track D); this group
  # covers the process-client seam, each test driving a real spawned `secrets __serve` round trip
  # against a real file store (no mocking), so keep the ceiling. Lower when split.
  - id: secrets
    when:
      - cli/src/lib/secrets-client.ts
      - cli/src/lib/secrets-client.test.ts
      - cli/src/lib/secrets-policy.ts
      - cli/src/lib/secrets-policy.test.ts
      - cli/src/lib/secrets-types.ts
      - cli/src/lib/reserved-stores.ts
      - cli/src/lib/reserved-stores.test.ts
      - cli/src/lib/sync-passphrase.ts
      - cli/src/lib/sync-passphrase.test.ts
      - cli/src/commands/secrets-passthrough.ts
      - cli/src/commands/setup-secrets.ts
    checks: [typecheck]
    budget_sec: 240

  # 150s, not the default 85s. Moving hooks.ts into hooks/install.ts (PR #2804,
  # run 32397180788) selected companion + importer tests inside a 129s impact
  # run (48 files / 1099 tests, all passed). Under 85s the move cannot merge.
  - id: hooks
    when:
      - cli/src/lib/hooks/**
    checks: [typecheck]
    budget_sec: 150

  - id: toolchain
    when:
      - cli/bun.lock
      - cli/vitest.config.ts
      - cli/tsconfig.json
      - cli/tests/setup.ts
      - cli/tests/global-setup.ts
      - cli/tests/secrets-standalone.ts
    suite: cli-full
    checks: [typecheck]

  # A version-only edit (release bump) is metadata (RUSH-2666); a dependency, script or field
  # change in package.json still routes to cli-full because the diff decides. When base/head shas
  # are unavailable it fails closed to cli-full.
  - id: toolchain-metadata
    when:
      - cli/package.json
    suite: metadata-gated
    tests:
      - cli/src/lib/version.test.ts
    checks: [typecheck]

  - id: impact-policy
    when:
      - scripts/ci-scope.ts
      - scripts/ci-scope.test.ts
      - scripts/ci-impact-bench.ts
      - scripts/ci-bench/**
      - scripts/guard-artifacts-confidential.ts
      - scripts/guard-artifacts-confidential.test.ts
      - cli/ci/test-ownership.yaml
      - .github/workflows/tests.yml
      - .github/workflows/tests-gate.test.ts
      - .githooks/pre-commit
    checks: [impact-tests, workflow-policy]

  - id: session-tracker
    when:
      - packages/session-tracker/**
    checks: [session-tracker]

# Explicit reviewed exemptions. These paths do not select tests on this Linux
# gate; native helpers and iOS have their own workflows.
testless:
  # Pre-existing test-less utility scripts surfaced by the apps/cli to cli rename (RUSH-3189),
  # which made every file read as newly added so the zero-selection check demanded tests. Listed
  # per-file, not by glob, so a genuinely new script still trips the check.
  - cli/scripts/backfill-changelog.ts
  - cli/scripts/bench-boot.sh
  - cli/scripts/bench-browser-loop.sh
  - cli/scripts/bench-ssh.mjs
  - cli/scripts/bench-staleness.ts
  - cli/scripts/companion-shim/bin/agents.js
  - cli/scripts/companion-shim/scripts/postinstall.js
  # One-time per-box fleet fix (PHNX-3285): re-enables unprivileged userns so codex's Linux
  # sandbox works. It mutates host security posture under sudo, so it cannot be unit-tested here;
  # its detection logic in linux-userns.ts is tested.
  - cli/scripts/enable-codex-sandbox.sh
  - cli/scripts/headless-sign-context.sh
  - cli/scripts/release-changelog.ts
  - cli/scripts/remote-sign-mac.sh
  - cli/scripts/scrub-orphan-branches.sh
  - cli/scripts/setup-npm-secret.sh
  - cli/scripts/sign-cli-binary.sh
  - cli/tests/bench-concurrent-writes.ts
  - cli/tests/bench-concurrent-writes.worker.ts
  - cli/tests/e2e/container-fresh-install.sh
  - cli/tests/e2e/fresh-install-settings.sh
  # AGI EXT moved to its own repo (phnx-labs/agi-ext, RUSH-3189); kept mapped so
  # historical paths never read as unmapped.
  - apps/ext/**
  # apps/cli moved up to cli/ (RUSH-3189 follow-up). The live paths are cli/** below; this old
  # prefix stays mapped so a historical or deleted apps/cli/... path, including this rename (read
  # as delete+add), never reads as unmapped.
  - apps/cli/**
  - .agents/**
  - assets/**
  - skills/**
  # demo/ moved under assets/, and openspec/ + root agents.yaml + NPM_CONSOLIDATION.md
  # were retired (PHNX-3229); kept mapped so those deletions/renames — which the
  # selector reads as delete+add — never read as unmapped, same as apps/ext above.
  - demo/**
  - openspec/**
  - agents.yaml
  - NPM_CONSOLIDATION.md
  - native/**
  - apps/ios/**
  # AGI Menu moved to its own repo (phnx-labs/agi-menu, PHNX-4036); kept mapped
  # so this deletion and any historical path never read as unmapped, same as
  # apps/ext above.
  - cli/menubar/**
  - cli/bin/**
  - cli/schema/**
  - cli/routines/**
  - cli/bench/**
  - packages/agi-cli/**
  - packages/swarmify-mirror/**
  - website/**
  - LICENSE
  - README.md
  - CHANGELOG.md
  - SECURITY.md
  - DESIGN.md
  - CONTRIBUTING.md
  - NPM_CONSOLIDATION.md
  - AGENTS.md
  - CLAUDE.md
  - GEMINI.md
  - .gitignore
  - .gitleaks.toml
  - agents.yaml
  - cli/.crabbox.yaml
  - cli/.gitignore
  - cli/.npmignore
  - cli/LICENSE
  - cli/CLAUDE.md
  - cli/GEMINI.md

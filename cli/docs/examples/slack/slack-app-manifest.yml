# Slack app manifest for the agents bridge: create the app at https://api.slack.com/apps ("From a
# manifest"), paste this, install it, and replace <box>.<tailnet>.ts.net with your Funnel host.
# Then store the signing secret via `agents secrets add slack SLACK_SIGNING_SECRET`.

display_information:
  name: agents
  description: Tag an agent on your machine; it does the work and replies in-thread.
  background_color: "#0a0a0a"

features:
  bot_user:
    display_name: agents
    always_online: true
  slash_commands:
    - command: /agents
      url: https://<box>.<tailnet>.ts.net/hooks/slack
      description: Run an agent on your box, scoped to a project
      usage_hint: "AGI: rebase my open PR and check CI"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands          # the /agents slash command
      - app_mentions:read # receive @mentions
      - chat:write        # post the reply into the thread

settings:
  event_subscriptions:
    request_url: https://<box>.<tailnet>.ts.net/hooks/slack
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false

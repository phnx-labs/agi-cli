# Crabbox config for agents-cli's remote test runs (scripts/sandbox.sh). `profile` is a stable
# label, since the script acquires a box by profile (never the ephemeral slug), so a reaped box is
# replaced; a dedicated profile keeps this repo's warm pool apart from other repos.
profile: agents-cli
class: cpx62
sync:
  exclude:
    - .git
    - node_modules
    - dist
    - .bun
    - coverage
    - .agents/worktrees
